<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./main.css">
    <title>Stop Swearing Challenge</title>
</head>

<body>

    <header class="header">
        <div class="container">
            <div class="header__wrapper">
                <img class="header__img" src="./img/Sayt logotipi.png" alt="Logo">
                <div id="timer-display" class="timer-display">06:00:00:00</div>
                <button class="header__btn" id="detailsBtn">To'liq ma'lumot!</button>
            </div>
        </div>
    </header>

    <main class="container">
        <section class="hero" id="participants-grid">
        </section>

        <section class="controls">
            <button id="startTimerBtn" class="main-btn">Vaqtni ishga tushirish</button>
            <button id="saveBtn" class="main-btn blue-btn">Natijalarni saqlash</button>
        </section>
    </main>

    <button id="infoBtn">O'yin ma'lumotlari</button>
    
    <div id="infoModal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2>O'yin qoidalari</h2>
            <p>1. Har bir ishtirokchida 15 ball bor.</p>
            <p>2. Har bir so'kinganlik uchun 1 ball ayiriladi.</p>
            <p>3. Challenge 6 kun davom etadi.</p>
            <p>4. Kimning balli 0 bo'lsa, u mag'lub hisoblanadi!</p>
        </div>
    </div>

    <div id="result-overlay" class="overlay">
        <div class="overlay-content">
            <h1 id="result-message"></h1>
            <button onclick="location.reload()" class="main-btn">Yangilash</button>
        </div>
    </div>

    <!-- node node.js -->

    <script src="./main.js"></script>
</body>

</html>
